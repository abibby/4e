		<h1 class="player">Burden of Guardianship</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Wilden, Nature’s Aspect racial trait<br/><b>Benefit</b>: When you use a wilden racial power and an ally is within 2 squares of you, you gain temporary hit points equal to 3 + your Constitution or Wisdom modifier.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 179.</p>
