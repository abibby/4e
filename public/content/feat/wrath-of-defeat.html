		<h1 class="player">Wrath of Defeat</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, runepriest, Wrathful Hammer class feature<br/><b>Benefit</b>: When you drop to 0 hit points or fewer, you can use an immediate interrupt to make a melee basic attack with a +2 bonus to the attack roll.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 189.</p>
