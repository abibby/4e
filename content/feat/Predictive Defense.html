		<h1 class="player">Predictive Defense</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, psion<br/><b>Benefit</b>: Whenever you hit an enemy with a psionic at-will attack power that is unaugmented, you gain a +2 bonus to all defenses against melee attacks until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 188.</p>
