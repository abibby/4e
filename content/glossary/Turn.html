		<h1 class="player">Turn</h1><p class="flavor">On a creature’s turn, it takes actions: a standard action, a move action, a minor action, and any number of free actions, in any order it wishes. See also once per turn.</p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217367200" target="_new">Player's Handbook</a>, page(s) 266, <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/247530000" target="_new">Rules Compendium</a>, page(s) 317.</p>
