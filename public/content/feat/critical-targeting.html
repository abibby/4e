		<h1 class="player">Critical Targeting</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Benefit</b>: When you score a critical hit with a melee or ranged attack, the attack deals 2 extra damage and you gain a +2 bonus to damage rolls against the creature you hit until the end of the encounter.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/387" target="_new">Dragon Magazine 387</a>, page(s) 59.</p>
