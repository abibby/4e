		<h1 class="player">Polearm Momentum</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Dex 15, Wis 15, fighter<br/><b>Benefit</b>: Whenever you use a polearm or a spear attack to push or slide a target 2 or more squares, you can also knock that target prone at the end of the forced movement.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217897200" target="_new">Martial Power</a>, page(s) 138.</p>
