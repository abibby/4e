		<h1 class="player">space</h1><p class="flavor">The square area that a creature occupies or the squares where an object or a phenomenon is located. A typical adventurer’s space is a single square.</p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/247530000" target="_new">Rules Compendium</a>, page(s) 316.</p>
