		<h1 class="player">Sympathetic Transference</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, wizard<br/><b>Benefit</b>: When you immobilize, restrain, or slow an enemy, choose an ally within 20 squares of you that is also suffering the same condition. End that condition.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/380" target="_new">Dragon Magazine 380</a>, page(s) 42.</p>
