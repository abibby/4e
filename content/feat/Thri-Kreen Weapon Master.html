		<h1 class="player">Thri-Kreen Weapon Master</h1><p class="flavor"><b>Prerequisite</b>: Thri-kreen race<br/><b>Benefit</b>: You gain proficiency with the gythka and the chatkcha. Additionally, you gain a +2 feat bonus to damage rolls with these weapons. This bonus increases to +3 at 11th level and +4 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/411" target="_new">Dragon Magazine 411</a>.</p>
