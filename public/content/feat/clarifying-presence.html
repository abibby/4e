		<h1 class="player">Clarifying Presence</h1><p class="flavor"><b>Epic Tier</b><br/><b>Prerequisite</b>: 21st level, shardmind, Telepathy racial trait<br/><b>Benefit</b>: When any ally within your telepathy range makes a saving throw against an effect that dazes or stuns, he or she can roll twice and use either result.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 190.</p>
