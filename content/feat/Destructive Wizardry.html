		<h1 class="player">Destructive Wizardry</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Dex 13, wizard<br/><b>Benefit</b>: When you use an arcane attack power and hit two or more creatures, you gain a +2 bonus to that power’s damage rolls.<br/>This bonus increases to +3 at 11th level and to +4 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786949571" target="_new">Arcane Power</a>, page(s) 125.</p>
