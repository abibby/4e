		<h1 class="player">Cleanse the Madness</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Shardmind or wilden<br/><b>Benefit</b>: You gain a +2 bonus to damage rolls against aberrant creatures. The bonus increases to +4 at 11th level and +6 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 180.</p>
