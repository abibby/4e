		<h1 class="player">character</h1><p class="flavor">Another term for a creature. The term is usually used to refer to a person who is not monstrous: either an adventurer or a DM-controlled person (sometimes called a nonplayer character, or NPC).</p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/247530000" target="_new">Rules Compendium</a>, page(s) 309.</p>
