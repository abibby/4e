		<h1 class="player">Knife in the Dark</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Drow<br/><b>Benefit</b>: You gain a +4 feat bonus to damage rolls against targets within your cloud of darkness. This bonus increases to +5 at 11th level, and +6 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/382" target="_new">Dragon Magazine 382</a>, page(s) 67.</p>
