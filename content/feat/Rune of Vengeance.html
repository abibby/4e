		<h1 class="player">Rune of Vengeance [Rune]</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Runepriest<br/><b>Benefit</b>: The first time you are bloodied during an encounter, you gain a bonus to damage rolls equal to the number of rune feats you have. The bonus lasts until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 183.</p>
