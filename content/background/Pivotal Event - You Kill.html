		<h1   class="player">Pivotal Event - You Kill</h1><p class="flavortext"><b>Campaign Setting: </b>General<br/></p>Through accident, error, or misbegotten intention, you were responsible for the death of an ally, friend, or loved one. Who was it, and how does it torment you?<br/>&nbsp;&nbsp;&nbsp;&nbsp;<i>Associated Skills: </i>Bluff, Heal<br/><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/383" target="_new">Dragon Magazine 383</a>, page(s) 80.</p>
