		<h1 class="player">Sorcerous Blade Channeling</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Sorcerer<br/><b>Benefit</b>: When you use any ranged sorcerer attack power through a dagger, you can use the power as a melee attack. If you do so, the power’s range equals your melee reach.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786950164" target="_new">Player's Handbook 2</a>, page(s) 189.</p>
