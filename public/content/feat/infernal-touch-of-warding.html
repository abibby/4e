		<h1 class="player">Infernal Touch of Warding</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Tiefling, paladin, lay on hands power<br/><b>Benefit</b>: When you use lay on hands, the target also gains fire resistance equal to 5 + one-half your level until the end of the encounter.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/253830000" target="_new">Player's Handbook Races: Tiefling</a>, page(s) 26.</p>
