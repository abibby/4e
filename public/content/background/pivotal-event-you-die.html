		<h1   class="player">Pivotal Event - You Die</h1><p class="flavortext"><b>Campaign Setting: </b>General<br/></p>You died, either through foul play or by accident, and some person or event brought you back to life. Do you know what returned you from the dead?<br/>&nbsp;&nbsp;&nbsp;&nbsp;<i>Associated Skills: </i>Endurance, Heal<br/><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/383" target="_new">Dragon Magazine 383</a>, page(s) 80.</p>
