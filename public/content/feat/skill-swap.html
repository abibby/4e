		<h1 class="player">Skill Swap</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: 2nd level, human. Bonus At-Will Power racial trait<br/><b>Benefit</b>: You swap out your bonus at-will attack power for a skill power for which you meet the prerequisites. You can change this power by retraining the feat.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/383" target="_new">Dragon Magazine 383</a>, page(s) 69.</p>
