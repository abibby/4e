		<h1 class="player">Heavenly Halberdier</h1><p class="flavor"><b>Prerequisite</b>: Runepriest<br/><b>Benefit</b>: You gain proficiency with the glaive and the halberd. When you hit an enemy with a runepriest at-will attack power while using a halberd or a glaive, you can slide that target 1 square as a free action.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/404" target="_new">Dragon Magazine 404</a>.</p>
