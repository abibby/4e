		<h1 class="player">Retreat Technique</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, ranger<br/><b>Benefit</b>: Whenever you hit an enemy with a melee attack during your turn, you don’t provoke opportunity attacks from that enemy for moving away from it until the end of your turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/251230000" target="_new">Martial Power 2</a>, page(s) 143.</p>
