		<h1 class="player">Bolstering Touch</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Half-elf, paladin, lay on hands power<br/><b>Benefit</b>: When you use lay on hands on an ally, the target can regain hit points equal to your healing surge value rather than his or her own healing surge value.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/385" target="_new">Dragon Magazine 385</a>, page(s) 68.</p>
