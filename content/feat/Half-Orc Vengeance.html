		<h1 class="player">Half-Orc Vengeance</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Half-orc, warden<br/><b>Benefit</b>: The first time you are bloodied during an encounter, you gain a +2 feat bonus to attack rolls and damage rolls against creatures marked by you until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/379" target="_new">Dragon Magazine 379</a>, page(s) 45.</p>
