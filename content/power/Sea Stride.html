		<h1 class="atwillpower"><span class="level">Warden Utility 6</span>Sea Stride</h1><p class="flavor"><i>You draw on the strength of flowing water to glide through the waves with ease.</i></p><p class="powerstat"><b>At-Will</b>&nbsp;&nbsp; <img src="images/bullet.gif" alt=""/>&nbsp;&nbsp;&nbsp;&nbsp; <b>Primal</b><br/><b>Minor Action</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>Personal</b> </p><p class="flavor"><b>Effect</b>: You gain a swim speed equal to your speed until the end of your turn.</p><br/><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786950164" target="_new">Player's Handbook 2</a>, page(s) 158.</p>
