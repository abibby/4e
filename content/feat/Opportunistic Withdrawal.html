		<h1 class="player">Opportunistic Withdrawal</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level<br/><b>Benefit</b>: While you are adjacent to an enemy granting combat advantage to you, your movement doesn’t provoke opportunity attacks from that enemy.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 188.</p>
