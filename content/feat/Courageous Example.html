		<h1 class="player">Courageous Example</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Benefit</b>: Whenever you succeed on a saving throw to end an effect, the next ally to make a saving throw within 5 squares of you before the start of your next turn gains a +4 bonus to that saving throw.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/377" target="_new">Dragon Magazine 377</a>, page(s) 44.</p>
