		<h1 class="player">Speed of Sea and Sky</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Genasi, warlord, swiftcurrent or windwalker<br/><b>Benefit</b>: When you use your swiftcurrent or windwalker racial power, each ally within 5 squares of you gains a +2 bonus to speed until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/251230000" target="_new">Martial Power 2</a>, page(s) 139.</p>
