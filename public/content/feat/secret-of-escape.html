		<h1 class="player">Secret of Escape</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, wilden<br/><b>Benefit</b>: Once per day when you drop to 0 hit points or fewer and don’t die, you can teleport to a square adjacent to an ally within 10 squares of you.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 189.</p>
