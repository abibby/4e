		<h1 class="player">Rising Fury</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Barbarian<br/><b>Benefit</b>: When you reduce an enemy to 0 hit points, you gain a +2 feat bonus to weapon damage rolls until the end of your next turn. The bonus increases to +3 at 11th level and +4 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786950164" target="_new">Player's Handbook 2</a>, page(s) 188.</p>
