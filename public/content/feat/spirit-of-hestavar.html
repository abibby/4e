		<h1 class="player">Spirit of Hestavar</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Leader role, must worship Erathis<br/><b>Benefit</b>: While adjacent to you, an ally gains a +2 feat bonus to his or her healing surge value. This bonus increases to +4 at 11th level and +6 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/387" target="_new">Dragon Magazine 387</a>, page(s) 61.</p>
