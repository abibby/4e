		<h1 class="player">Peerless Reaction</h1><p class="flavor"><b>Epic Tier</b><br/><b>Prerequisite</b>: 21st level, githzerai<br/><b>Benefit</b>: When you are hit by an attack, you can expend the use of your iron mind as an immediate interrupt to use your second wind, instead of gaining iron mind’s normal effect.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 190.</p>
