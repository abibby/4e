		<h1 class="player">Drop Prone</h1><p class="flavor">Sometimes a creature wants to be prone—to avoid ranged attacks, for instance, or to play dead.<br/><br/>Drop Prone<br/>&nbsp;&nbsp;&nbsp;&nbsp;<img src="images/bullet.gif" alt=""/>&nbsp;&nbsp;&nbsp;&nbsp; Action: Minor action.<br/>&nbsp;&nbsp;&nbsp;&nbsp;<img src="images/bullet.gif" alt=""/>&nbsp;&nbsp;&nbsp;&nbsp; Prone: The creature is now prone.</p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/247530000" target="_new">Rules Compendium</a>, page(s) 242.</p>
