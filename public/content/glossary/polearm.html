		<h1 class="player">Polearm</h1><p class="flavor">Polearms are reach weapons (see above) mounted at the end of long hafts. A polearm typically also belongs to a second weapon group, such as axe or spear.</p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217367200" target="_new">Player's Handbook</a>, page(s) 216, <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/247530000" target="_new">Rules Compendium</a>, page(s) 272.</p>
