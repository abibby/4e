		<h1 class="player">See It Coming</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Dex 13, Wis 13<br/><b>Benefit</b>: When a creature flanking you hits you, being flanked does not cause you to grant combat advantage until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/387" target="_new">Dragon Magazine 387</a>, page(s) 59.</p>
