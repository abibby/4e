		<h1 class="player">Linebreaker</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, battlemind, speed of thought power<br/><b>Benefit</b>: When you use your speed of thought, you can enter an enemy’s space. Doing so ends the movement. You must then slide the enemy 1 square.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 188.</p>
