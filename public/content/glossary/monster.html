		<h1 class="player">monster</h1><p class="flavor">A creature controlled by the Dungeon Master. The term is usually used to refer to creatures that are hostile to the adventurers (often including DM-controlled characters). See also adventurer, character, and creature.</p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/247530000" target="_new">Rules Compendium</a>, page(s) 313.</p>
