		<h1 class="player">Bloodied Ferocity</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Minotaur<br/><b>Benefit</b>: The first time you are bloodied during an encounter, you can make a melee basic attack as a free action. If you do so, you grant combat advantage until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 177.</p>
