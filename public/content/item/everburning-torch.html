		<h1 class="player">Everburning Torch</h1><br/><b>Category</b>: Gear<br/><b>Price</b>: 50 gp <br/><b>Weight</b>: 1 lb<br/><b>Description</b>: This torch never stops burning. It casts bright light to a radius of 5 squares but sheds no heat, so you can stow it in a bag or a pouch. You can’t set fire to anything with it.<p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217367200" target="_new">Player's Handbook</a>, page(s) 222.</p>
