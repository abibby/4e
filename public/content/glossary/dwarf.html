		<h1 class="player">dwarf</h1><p class="flavor">Dwarves are creatures of the earth, as steadfast and hardy as stone. Industrious and inventive, dwarves live in the mountains of the world. They build remarkable fortress-cities among the peaks, under which they delve into the earth for riches and raw materials.</p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217207200" target="_new">Monster Manual</a>.</p>
