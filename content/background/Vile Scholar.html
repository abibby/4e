		<h1   class="player">Vile Scholar</h1><p class="flavortext"><b>Campaign Setting: </b>General<br/></p>Long, glorious hours of study have turned you into a veritable font of dark lore. Knowledge is, after all, the most formidable and remorseless of weapons.<br/>&nbsp;&nbsp;&nbsp;&nbsp;<i>Associated Skills: </i>Arcana, History<br/><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/34416000" target="_new">The Book of Vile Darkness</a>, page(s) 1-19.</p>
