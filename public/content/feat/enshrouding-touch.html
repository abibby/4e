		<h1 class="player">Enshrouding Touch</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Gnome, paladin, lay on hands or virtue’s touch power<br/><b>Benefit</b>: Each ally targeted by your lay on hands or virtue’s touch power gains concealment until the end of his or her next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/384" target="_new">Dragon Magazine 384</a>, page(s) 60.</p>
