		<h1 class="player">Saving Breath</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Con 13, bard, majestic word power<br/><b>Benefit</b>: When you use majestic word, the target gains a bonus equal to your Constitution modifier to the next saving throw it makes before the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/383" target="_new">Dragon Magazine 383</a>, page(s) 56.</p>
