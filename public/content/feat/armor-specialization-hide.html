		<h1 class="player">Armor Specialization (Hide)</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, Con 15, training with hide armor<br/><b>Benefit</b>: You gain a +1 feat bonus to AC when wearing hide armor. You reduce the check penalty incurred by hide armor by 1.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217367200" target="_new">Player's Handbook</a>, page(s) 202.</p>
