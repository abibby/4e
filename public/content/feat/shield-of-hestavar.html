		<h1 class="player">Shield of Hestavar</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Defender role, must worship Erathis<br/><b>Benefit</b>: While adjacent to you, an ally gains resist 2 to attacks from enemies marked by you. This resistance increases to 4 at 11th level and 6 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/387" target="_new">Dragon Magazine 387</a>, page(s) 61.</p>
