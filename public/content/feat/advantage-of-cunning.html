		<h1 class="player">Advantage of Cunning</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Bard, Virtue of Cunning class feature<br/><b>Benefit</b>: When you slide an ally with your Virtue of Cunning, you can also slide an enemy that was adjacent to that ally into the space the ally vacated.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786950164" target="_new">Player's Handbook 2</a>, page(s) 184.</p>
