		<h1 class="player">Uncanny Dodge</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, Wis 15<br/><b>Benefit</b>: Enemies do not gain the normal +2 bonus to attack rolls against you when they have combat advantage. Any other benefits derived from combat advantage still apply.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217367200" target="_new">Player's Handbook</a>, page(s) 206.</p>
