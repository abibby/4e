name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'images/**'
      - 'web/**'
      - 'build/indexgen.py'
      - 'build/searchdata.py'
      - 'build/site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Finish an in-progress Pages deployment before starting another.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TYPESENSE_URL: ${{ vars.TYPESENSE_URL }}
      TYPESENSE_COLLECTION: ${{ vars.TYPESENSE_COLLECTION || 'compendium' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node for frontend tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate search configuration
        env:
          TYPESENSE_SEARCH_KEY: ${{ secrets.TYPESENSE_SEARCH_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          endpoint = urlparse(os.environ.get('TYPESENSE_URL', ''))
          if endpoint.scheme != 'https' or not endpoint.hostname or endpoint.username or endpoint.password:
              raise SystemExit('Set the TYPESENSE_URL Actions variable to your HTTPS Typesense endpoint.')
          if not os.environ.get('TYPESENSE_SEARCH_KEY'):
              raise SystemExit('Set the TYPESENSE_SEARCH_KEY Actions secret to a search-only key.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -v
          node --experimental-default-type=module tests/search-client.test.mjs

      - name: Generate tables and static pages
        env:
          TYPESENSE_SEARCH_KEY: ${{ secrets.TYPESENSE_SEARCH_KEY }}
        run: |
          python3 build/indexgen.py
          python3 build/site.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
