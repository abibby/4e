		<h1 class="player">Bloodied Boon</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Warlock, Eldritch Pact class feature, Warlock’s Curse class feature<br/><b>Benefit</b>: You can choose to gain your pact boon when an enemy you curse is first bloodied. If you do so, you remove your curse from that enemy.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/384" target="_new">Dragon Magazine 384</a>, page(s) 30.</p>
