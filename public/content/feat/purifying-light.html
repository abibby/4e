		<h1 class="player">Purifying Light</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Cha 15, any divine class<br/><b>Benefit</b>: Your radiant prayers gain a +1 bonus to attack rolls when used against undead targets. At 11th level, this bonus increases to +2. At 21st level, this bonus increases to +3.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/371" target="_new">Dragon Magazine 371</a>, page(s) 8.</p>
