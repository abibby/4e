		<h1 class="player">Wrathful Panoply</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, invoker, armor of wrath power<br/><b>Benefit</b>: When you use armor of wrath, you gain a +1 bonus to all defenses until the end of your next turn. At 21st level, the bonus increases to +2.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/387" target="_new">Dragon Magazine 387</a>, page(s) 42.</p>
