		<h1 class="player">Guileful Shift</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Halfling, avenger, must worship Avandra<br/><b>Benefit</b>: When your oath of enmity target misses you with an attack, you can shift 1 square to a square closer to or adjacent to the target as a free action.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=dnd/drtoc/384" target="_new">Dragon Magazine 384</a>, page(s) 70.</p>
