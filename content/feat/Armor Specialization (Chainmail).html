		<h1 class="player">Armor Specialization (Chainmail)</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, Dex 15, training with chainmail<br/><b>Benefit</b>: You gain a +1 feat bonus to AC while wearing chainmail. You reduce the check penalty incurred by chainmail by 1.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/217367200" target="_new">Player's Handbook</a>, page(s) 202.</p>
