		<h1 class="player">Shield Mastery</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, proficiency with light shields or heavy shields<br/><b>Benefit</b>: While wielding a shield with which you have proficiency, your shield bonus also applies to your Fortitude.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndlist&brand=All&year=All&type=CoreGameProducts" target="_new">Player's Handbook 3</a>, page(s) 189.</p>
