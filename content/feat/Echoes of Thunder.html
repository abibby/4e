		<h1 class="player">Echoes of Thunder</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Benefit</b>: When you hit with any thunder attack power, you gain a +1 bonus to damage rolls until the end of your next turn. The bonus increases to +2 at 11th level and +3 at 21st level.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786950164" target="_new">Player's Handbook 2</a>, page(s) 184.</p>
