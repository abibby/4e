		<h1 class="player">Revitalizing Font of Life</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Warden, Font of Life class feature<br/><b>Benefit</b>: If you succeed on a saving throw granted by Font of Life, you gain a +2 bonus to all other saving throws during or at the end of your current turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786950164" target="_new">Player's Handbook 2</a>, page(s) 188.</p>
