		<h1 class="player">Strength of Stone</h1><p class="flavor"><b>Heroic Tier</b><br/><b>Prerequisite</b>: Goliath, paladin<br/><b>Benefit</b>: When you use your lay on hands or call of virtue power on an ally, the ally gains resistance to all damage equal to your Strength modifier until the end of your next turn.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/default.asp?x=products/dndacc/9780786949823" target="_new">Divine Power</a>, page(s) 136.</p>
