		<h1 class="player">Dazing Fist</h1><p class="flavor"><b>Paragon Tier</b><br/><b>Prerequisite</b>: 11th level, monk, Stone Fist class feature<br/><b>Benefit</b>: When you hit an enemy with a daily attack power, you also daze the enemy (save ends). If the attack already dazes the enemy, it instead deals 5 extra damage.<br/></p><p class="publishedIn">Published in <a href="http://www.wizards.com/dnd/Product.aspx?x=dnd/products/dndacc/210940000" target="_new">Psionic Power</a>, page(s) 136.</p>
